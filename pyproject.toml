[project]
name = "engram"
version = "0.1.0"
description = "Human-brain-like memory system for AI coding agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0,<2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
engram = "engram.cli:main"
engram-server = "engram.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mypy>=2.3.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
files = ["src/engram"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/engram"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
